# A generic, single database configuration.

[alembic]
# path to migration scripts.
script_location = %(here)s/alembic

# prepend the backend project root to sys.path so `app.*` imports work.
prepend_sys_path = .

# Use date-based revision filenames for readability.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
timezone = UTC

# max length of characters to apply to the "slug" field
truncate_slug_length = 60

# path_separator default
path_separator = os

# Database URL — kept as a placeholder. The real URL is read from
# `app.config.settings.database_url` inside alembic/env.py so that env vars
# remain the single source of truth (per backend/AGENTS.md).
sqlalchemy.url = postgresql://user:pass@localhost:5432/postgres


[post_write_hooks]
# Lint newly generated revision scripts with ruff.
hooks = ruff
ruff.type = module
ruff.module = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
